[project]
name = "uso"
version = "0.1.0"
description = "US Open late-round charting: player positions at contact, rally length, stroke type"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "scipy",
  "scikit-learn",
  "opencv-python",
  "torch",
  "torchvision",
  "rfdetr",
  "supervision",
  "ultralytics",
  "openai>=3.26.0",
  "soundfile",
  "tqdm",
  "pillow",
  "av",
  "coremltools",
  "tabulate",
  "boto3",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
