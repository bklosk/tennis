[project]
name = "tennischart"
version = "0.1.0"
description = "Broadcast tennis charting: contact positions, rally length and stroke type from match video"
requires-python = ">=3.10"
license = { text = "Code: MIT. Derived data: CC BY-NC-SA 4.0 (Match Charting Project)" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# RF-DETR (Apache-2.0 checkpoints only: Nano/Small/Medium/Large + keypoint preview).
# Pulls in torch and supervision. ffmpeg/ffprobe must be on PATH separately.
video = [
    "rfdetr>=1.3",
]
dev = [
    "pytest>=8",
]

[project.scripts]
tennischart = "tennischart.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tennischart*"]

[tool.setuptools.package-data]
tennischart = ["resources/*.json", "resources/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: renders and decodes a synthetic broadcast with ffmpeg",
]
